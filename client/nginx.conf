server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Static assets are immutable + hashed by Vite.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # API reverse proxy - keeps cookies first-party (SameSite=Lax works).
  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 30m; # headroom over MAX_UPLOAD_MB
  }

  # Uploaded media lives on the API service for now.
  location /uploads/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    expires 7d;
  }

  # SPA fallback - deep links must serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
